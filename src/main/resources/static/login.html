<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Acceso al directorio de funcionarios">
    <title>Iniciar sesión · Directorio de funcionarios</title>
    <link rel="stylesheet" href="/login.css">
    <script src="/login.js" defer></script>
</head>
<body>
<main class="login-layout">
    <section class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">DF</div>
        <p class="eyebrow">GESTIÓN INSTITUCIONAL</p>
        <h1 id="login-title">Directorio de funcionarios</h1>
        <p class="intro">Ingresa tus credenciales para continuar.</p>

        <div id="login-error" class="login-error" role="alert" hidden></div>

        <form id="login-form">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button id="submit-button" class="button" type="submit">Iniciar sesión</button>
        </form>
        <p class="security-note">Conexión protegida mediante autenticación HTTP Basic.</p>
    </section>
</main>
</body>
</html>
